# @package train
# Surrogate-gradient training (SQS paper, arXiv:2506.21324, Appendix A) with Adam.
name: surrogate
run_suffix: ""            # optional extra tag on the run directory name
epochs: null              # null -> protocol.epochs_by_dataset / protocol.epochs
epochs_by_dataset: {}     # e.g. {memprobe: 60}
lr: null                  # null -> model.lr_by_protocol / protocol.lr
batch_size: null          # null -> protocol.batch_size
optimizer: adam
betas: [0.9, 0.999]
weight_decay: 0.0
grad_clip: null           # e.g. 1.0 to clip the global grad norm
# ---------------------------------------------------------------- early stopping
# Off by default (patience: null): the run trains for exactly `epochs`. Set patience to
# stop once the train loss stops improving; `epochs` stays a hard cap. The plateau runs
# use patience=60, min_delta=1e-4, epochs=300.
patience: null            # stop when none of the last `patience` epochs improves on the
                          # best train loss before them; null -> disabled. Must be >= 1.
min_delta: 1.0e-4         # an epoch improves only if it beats that best by more than this
monitor_tail: 10          # how many trailing monitored values metrics.json keeps
                          # (at least patience + 1, so the stopping decision is auditable)

eval_every: 1
save_model: false
num_workers: 0
drop_last_train: false
limit_train_batches: null # smoke-test knobs
limit_test_batches: null
