# @package model
# Frozen read-gate angle, arm 1 of 4: scale 0.
#
# Same circuit as sqsnn_read_uni (ansatz crx_both, uniform init), but the read-gate angles
# theta_crx2 are drawn from U(0, theta_crx2_scale) and frozen (theta_crx2_trainable: false).
# The four arms use scales 0, pi/4, pi/2 and pi. Wiring, gate count and parameter tensors are
# the same in every arm, and theta_crx2 is drawn last, so at one seed every other parameter
# starts from the same values and the arms differ only in the read-gate angles.
#
# At scale 0 every read-gate angle is exactly 0, CRX(0) = I, and the circuit is crx_all: the
# spike probabilities do not depend on the memory state, so recall should sit at chance (25%).
#
# Notes.
#   * Only trainable parameters are counted (requires_grad), so all four arms report the
#     same n_params, H + C fewer than sqsnn_read_uni, which also trains theta_crx2.
#     n_params_stored in metrics.json counts the frozen angles too.
#   * A frozen arm optimises a restricted model, so scoring below sqsnn_read_uni is expected.
name: sqsnn_angle0
hidden: null
detach_state: false
layer:
  _target_: sqs_bench.neurons.sqs.SQSLayer
  N: 1
  N_mem: 1
  ansatz: crx_both
  surrogate: marginal_sigmoid
  w_init: normal
  theta_init_scale: null
  theta_init: uniform
  theta_crx2_scale: 0.0            # CRX(0) = I -> the circuit is crx_all
  theta_crx2_trainable: false
hidden_layer_overrides: {}
output_layer_overrides: {}
lr_by_protocol: {}
overrides_by_protocol: {}
